app-id: io.github.tobagin.sonar
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
command: sonar
finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --share=network
  - --talk-name=org.freedesktop.secrets

cleanup:
  - /include
  - /lib/pkgconfig
  - /man
  - /share/doc
  - /share/gtk-doc
  - /share/man
  - /share/pkgconfig
  - "*.la"
  - "*.a"

modules:
  - name: libsecret
    buildsystem: meson
    config-opts:
      - -Dmanpage=false
      - -Dvapi=true
      - -Dgtk_doc=false
      - -Dbash_completion=disabled
    sources:
      - type: git
        url: https://gitlab.gnome.org/GNOME/libsecret.git
        tag: 0.21.8
        commit: 9e52f6ae1c74dba683fb4793d349c26d4c1115b8

  - name: ngrok
    buildsystem: simple
    build-commands:
      - tar -xzf ngrok.tgz
      - install -Dm755 ngrok ${FLATPAK_DEST}/bin/ngrok
    sources:
      - type: file
        url: https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-linux-amd64.tgz
        sha256: cec0b4997fcc5f529dfc74bac89050354d11a915f968720600039738fdf330cf
        dest-filename: ngrok.tgz
        only-arches: [x86_64]
      - type: file
        url: https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-linux-arm64.tgz
        sha256: 3b6ba05a9d9585c34157fa0819fa95cdb13839f5b506b9e63204705cf7f79e29
        dest-filename: ngrok.tgz
        only-arches: [aarch64]

  - name: sonar
    buildsystem: meson
    sources:
      - type: git
        url: https://github.com/tobagin/Sonar.git
        tag: v2.6.0
        commit: TAG_COMMIT_PLACEHOLDER