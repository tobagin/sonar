app-id: io.github.tobagin.sonar
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
command: sonar
finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --share=network
  - --talk-name=org.freedesktop.secrets

cleanup:
  - /include
  - /lib/pkgconfig
  - /man
  - /share/doc
  - /share/gtk-doc
  - /share/man
  - /share/pkgconfig
  - "*.la"
  - "*.a"

modules:
  - name: libsecret
    buildsystem: meson
    config-opts:
      - -Dmanpage=false
      - -Dvapi=true
      - -Dgtk_doc=false
      - -Dbash_completion=disabled
    sources:
      - type: git
        url: https://gitlab.gnome.org/GNOME/libsecret.git
        tag: 0.21.7
        commit: 0936f740c02b60f02657729cd99f581db4517a41

  - name: ngrok
    buildsystem: simple
    build-commands:
      - tar -xzf ngrok.tgz
      - install -Dm755 ngrok ${FLATPAK_DEST}/bin/ngrok
    sources:
      - type: file
        url: https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-linux-amd64.tgz
        sha256: 6efc7d5b055af19957a1667bc4c7a08fde931858e122a4c2c8dece4766458d61
        dest-filename: ngrok.tgz
        only-arches: [x86_64]
      - type: file
        url: https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-linux-arm64.tgz
        sha256: dbb22df857a6fd827c7b5b2023e552de97a3715af0521833b8e4719c54bd2904
        dest-filename: ngrok.tgz
        only-arches: [aarch64]

  - name: sonar
    buildsystem: meson
    sources:
      - type: git
        url: https://github.com/tobagin/Sonar.git
        tag: v2.5.0
        commit: a68b1929325160c3bbe8aaeaf232dec66bd042b0